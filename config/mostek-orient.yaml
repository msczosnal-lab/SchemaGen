# Kontrakt orientacji mostka (filar SYMBOLE, prompt 012).
#
# Mostek ma 3 terminale i wystepuje w 8 orientacjach (grupa D4: 4 obroty x lustro).
# Sam ksztalt lustrzany jest CHIRALNY (rozny od kazdego obrotu) -> pelne 8 klas.
#
# Labeler: pozostaje generyczny tag `mostek` (picker bez zmian). Orientacja jest
# rozpoznawana AUTOMATYCZNIE przy eksporcie przez dopasowanie do 8 eksemplarzy
# (train/mostek_tiles.py: expand_mostek_orientations). Kod: train/mostek_orient.py.
#
# Trening: globalna augmentacja w train/train_symbols.py ZOSTAJE 0 (klasy
# kierunkowe). Orientacje mostka wchodza jako syntetyczne KAFELKI (extra obrazy
# train), nie przez obrot stron.

# Kolejnosc = indeks w grupie D4 (m*4 + r); r = obrot 90 CCW, m = lustro.
classes:
  - mostek_r0
  - mostek_r90
  - mostek_r180
  - mostek_r270
  - mostek_m0
  - mostek_m90
  - mostek_m180
  - mostek_m270

# Tag generyczny z labelera, ktory podlega ekspansji na orientacje.
source_tag: mostek

# Tryb DOMYSLNY: AUTO — orientacje wyprowadzane z samych oznaczonych bboxow
# (kanonikalizacja C4 + 2 rodziny chiralnosci). Nie trzeba nic wycinac.
# exemplar_dir to OPCJONALNY override: 8 czystych cropow (nazwa = klasa + .png),
# uzywany tylko gdy komplet 8 plikow istnieje (gdy auto myli warianty rysunku).
exemplar_dir: data/mostek_exemplars

# Prog NCC dopasowania eksemplarza. Ponizej -> orientacja niepewna, tag zostaje
# generyczny `mostek` + wpis [SKIP] w logu eksportu.
min_score: 0.55

# Parametry kafelka syntetycznego.
tile:
  size: 96
  margin: 8
