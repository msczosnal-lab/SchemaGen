# Scalanie wizualnie nierozroznialnych klas YOLO.
# member (kanoniczna nazwa klasy z `class_report.py`) -> grupa.
#
# Tylko DWA scalenia (reszta klas osobno):
#   zlaczka        = zlaczka + terminal_przylaczeniowy
#   listwa_zlaczek = listwa_zlaczek + terminale_urzadzenia
#
# Osobno (NIE scalane): zlacze, terminal_sterownika_safety, zwarta_listwa_zlaczek,
# terminal_plc i wszystkie pozostale.

groups:
  zlaczka:
    - zlaczka
    - terminal_przylaczeniowy

  listwa_zlaczek:
    - listwa_zlaczek
    - terminale_urzadzenia
