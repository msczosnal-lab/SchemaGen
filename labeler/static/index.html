<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>SchemaGen Labeler</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>SchemaGen Labeler</h1>
    <p>Oznacz elementy opisem tekstowym — katalog w config/element-catalog.yaml</p>
  </header>
  <main class="layout">
    <aside id="pages-panel">
      <div id="bbox-editor">
        <h2>Nowy element</h2>
        <p id="editor-hint">Wpisz opis, narysuj bbox — pole sie wyczysci.</p>
        <label for="tag-input">Opis (nastepny bbox)</label>
        <textarea id="tag-input" rows="6" placeholder="np. Stycznik -K1&#10;Funkcja: zasilanie szyny DC" autocomplete="off"></textarea>
        <datalist id="element-suggestions"></datalist>
        <p id="class-hint" class="muted">Edycja istniejacych — lista po prawej.</p>
      </div>
      <h2>Strony</h2>
      <ul id="page-list"></ul>
    </aside>
    <section id="canvas-panel">
      <div id="page-nav">
        <button id="page-prev" type="button" title="Poprzednia strona (←)">←</button>
        <span id="page-position">— / —</span>
        <button id="page-next" type="button" title="Następna strona (→)">→</button>
      </div>
      <canvas id="canvas" width="800" height="600"></canvas>
      <p id="hint">Opis → bbox → edycja po prawej → Zapisz</p>
    </section>
    <aside id="annotations-panel">
      <h2>Elementy na stronie</h2>
      <ul id="annotation-list"></ul>
      <button id="save-btn" type="button">Zapisz strone</button>
      <button id="save-all-btn" type="button">Zapisz wszystkie</button>
      <button id="export-btn" type="button">Eksport YOLO + JSON</button>
      <p id="save-status" class="muted"></p>
    </aside>
  </main>
  <script src="/static/app.js?v=13"></script>
</body>
</html>
