<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>SchemaGen Labeler</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>SchemaGen Labeler</h1>
    <p>Oznacz elementy opisem tekstowym — katalog w config/element-catalog.yaml</p>
  </header>
  <main class="layout">
    <aside id="pages-panel">
      <div id="bbox-editor">
        <h2>Co oznaczasz?</h2>
        <p id="editor-hint">Wpisz opis, potem narysuj bbox.</p>
        <label for="tag-input">Opis elementu</label>
        <input id="tag-input" type="text" list="element-suggestions" placeholder="np. Stycznik -K1, Zasilanie 400V L1" autocomplete="off" />
        <datalist id="element-suggestions"></datalist>
        <p id="class-hint" class="muted">Podpowiedzi z katalogu po zapisie strony.</p>
      </div>
      <h2>Strony</h2>
      <ul id="page-list"></ul>
    </aside>
    <section id="canvas-panel">
      <div id="page-nav">
        <button id="page-prev" type="button" title="Poprzednia strona (←)">←</button>
        <span id="page-position">— / —</span>
        <button id="page-next" type="button" title="Następna strona (→)">→</button>
      </div>
      <canvas id="canvas" width="800" height="600"></canvas>
      <p id="hint">Wpisz opis → narysuj bbox → Zapisz</p>
    </section>
    <aside id="annotations-panel">
      <h2>Na tej stronie</h2>
      <ul id="annotation-list"></ul>
      <button id="save-btn" type="button">Zapisz</button>
      <button id="export-btn" type="button">Eksport YOLO + JSON</button>
    </aside>
  </main>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
