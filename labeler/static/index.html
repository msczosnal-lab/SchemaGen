<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>SchemaGen Labeler</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>SchemaGen Labeler</h1>
    <p>Oznaczanie symboli — MVP (canvas: COWORK prompt 001)</p>
  </header>
  <main class="layout">
    <aside id="pages-panel">
      <h2>Klasy</h2>
      <ul id="class-list"></ul>
      <h2>Strony</h2>
      <ul id="page-list"></ul>
    </aside>
    <section id="canvas-panel">
      <div id="page-nav">
        <button id="page-prev" type="button" title="Poprzednia strona (←)">←</button>
        <span id="page-position">— / —</span>
        <button id="page-next" type="button" title="Następna strona (→)">→</button>
      </div>
      <canvas id="canvas" width="800" height="600"></canvas>
      <p id="hint">Laduj strone z listy. Rysowanie bbox — implementacja w app.js (Cowork).</p>
    </section>
    <aside id="annotations-panel">
      <div id="bbox-editor">
        <h2>Opis elementu</h2>
        <p id="editor-hint">Zaznacz bbox na canvasie.</p>
        <label for="tag-input">Co to jest (tekst z schematu lub wlasny opis)</label>
        <input id="tag-input" type="text" list="element-suggestions" placeholder="np. Stycznik -K1, Silnik =M1" autocomplete="off" />
        <datalist id="element-suggestions"></datalist>
        <p id="class-hint" class="muted"></p>
      </div>
      <h2>Adnotacje</h2>
      <ul id="annotation-list"></ul>
      <button id="save-btn" type="button">Zapisz</button>
      <button id="export-btn" type="button">Eksport YOLO + JSON</button>
    </aside>
  </main>
  <script src="/static/app.js?v=2"></script>
</body>
</html>
